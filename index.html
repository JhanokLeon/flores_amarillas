<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flores Amarillas 🌻</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Audio local -->
  <audio id="bgAudio" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- Control flotante de audio (opcional, en esquina superior derecha) -->
  <button id="audioToggle" class="audio-control" style="display: none;" title="Pausar / Reanudar">
    🎵
  </button>

  <!-- Pantalla de bienvenida / Disparador de interacción -->
  <div class="welcome-screen" id="welcomeScreen">
    <div class="glass-box">
      <div class="seed-icon">🌻</div>
      <h2>Un detalle especial</h2>
      <p>Diseñado especialmente para iluminar este día.</p>
      <button id="btnStart" class="btn-glow">
        <span>Presiona para recibirlo ✨</span>
      </button>
    </div>
  </div>

  <!-- Mensaje flotante superior (aparece luego de florecer) -->
  <div class="floating-header" id="floatingHeader">
    <h1 class="glow-title">🌻 Para Ti 🌻</h1>
    <p id="subMessage">Que nunca te falten razones para sonreír</p>
  </div>

  <!-- Lienzo interactivo -->
  <canvas id="gardenCanvas"></canvas>

  <script src="js/script.js"></script>
</body>
</html>
